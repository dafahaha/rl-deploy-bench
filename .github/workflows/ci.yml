name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Include the sb3 extra: test_sb3_onnx_matches_predict guards against
          # the action-bounds double-unscale regression, and must actually run
          # in CI rather than being importorskip-skipped because dev alone
          # does not pull in stable-baselines3.
          pip install -e ".[dev,sb3]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Check code formatting
        run: |
          pip install black isort
          black --check src/ tests/ demo.py examples/
          isort --check-only src/ tests/ demo.py examples/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          # mypy is intentionally not run here: `mypy src/` currently reports
          # ~48 pre-existing typing errors (numpy/torch Any-return, list-vs-ndarray
          # friction). Keeping it installed-but-unrun would be a dead step; the
          # [tool.mypy] config in pyproject.toml remains for local opt-in runs.
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 src/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Check formatting
        run: |
          black --check src/ tests/ demo.py examples/
          isort --check-only src/ tests/ demo.py examples/
