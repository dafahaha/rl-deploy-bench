[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-deploy-bench"
version = "1.1.0"
description = "Cross-platform reinforcement learning model deployment and performance benchmarking toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "dafahaha", email = "dafahaha@users.noreply.github.com"}
]
maintainers = [
    {name = "dafahaha", email = "dafahaha@users.noreply.github.com"}
]
keywords = [
    "reinforcement-learning",
    "deployment",
    "benchmark",
    "onnx",
    "tensorrt",
    "quantization",
    "jetson",
    "edge-ai",
    "embodied-ai",
    "robotics",
    "model-compression",
    "inference",
    "performance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Benchmark",
]

dependencies = [
    "numpy>=1.21",
    "torch>=1.13",
    "onnx>=1.12",
    "onnxruntime>=1.14",
    "psutil>=5.9",
    "plotly>=5.0",
    "jinja2>=3.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.0"]
jetson = ["jetson-stats>=4.0"]
sb3 = ["stable-baselines3>=2.0", "gymnasium>=0.28"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "flake8",
    "build",
    "twine",
]
all = [
    "rl-deploy-bench[nvidia,jetson,sb3,dev]",
]

[project.urls]
Homepage = "https://github.com/dafahaha/rl-deploy-bench"
Documentation = "https://github.com/dafahaha/rl-deploy-bench/blob/main/API.md"
Repository = "https://github.com/dafahaha/rl-deploy-bench.git"
Issues = "https://github.com/dafahaha/rl-deploy-bench/issues"
Discussions = "https://github.com/dafahaha/rl-deploy-bench/discussions"
Changelog = "https://github.com/dafahaha/rl-deploy-bench/blob/main/CHANGELOG.md"

[project.scripts]
rl-deploy-bench = "rl_deploy_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]
